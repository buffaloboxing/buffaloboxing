<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 40px 20px; max-width: 750px; margin: 0 auto; background: #fafafa; color: #1a1a1a; line-height: 1.7;
  }
  .page-frame { background: #fff; border: 1px solid #1a1a1a; border-radius: 2px; padding: 32px 20px; }
  @media (min-width: 768px) { .page-frame { padding: 48px 40px; } }
  .brand-header { text-align: center; margin-bottom: 30px; padding-bottom: 24px; border-bottom: 1px solid #1a1a1a; }
  .brand-name { font-size: 20px; font-weight: 600; letter-spacing: 3px; }
  .brand-series { font-size: 11px; letter-spacing: 4px; color: #666; margin-top: 6px; text-transform: uppercase; }

  .page-title { font-size: 20px; font-weight: 500; margin-bottom: 10px; text-align: center; letter-spacing: 1px; }
  .page-sub { font-size: 13px; color: #999; margin-bottom: 30px; text-align: center; }

  .item-card { border: 1px solid #1a1a1a; border-radius: 2px; margin-bottom: 22px; overflow: hidden; }
  .item-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: #1a1a1a; color: #fff; }

  .item-body { padding: 18px; }
  .line { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .line .k { color: #999; flex: 0 0 auto; }
  .line .v { font-weight: 500; text-align: right; }
  .sub-title { font-size: 13px; font-weight: 600; letter-spacing: 1px; margin: 16px 0 6px; color: #333; }
  .detail { font-size: 13px; color: #333; margin: 4px 0; }
  .color-swatch { display: inline-block; width: 13px; height: 13px; border-radius: 2px; margin-right: 7px; vertical-align: middle; border: 1px solid rgba(0,0,0,.08); }
  .color-line { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; gap: 10px; }
  .item-subtotal { display: flex; justify-content: space-between; padding: 14px 18px 4px; font-size: 14px; }
  .item-subtotal b { font-size: 16px; }
  .edit-link { padding: 0 18px 16px; }
  .edit-btn { width: 100%; padding: 12px; border: 1px solid #d9d9d9; background: #fff; border-radius: 2px; cursor: pointer; font-size: 13px; letter-spacing: 2px; color: #1a1a1a; }
  .edit-btn:hover { border-color: #1a1a1a; }

  .notice-box { border: 1px solid #f0f0f0; background: #fafafa; border-radius: 2px; padding: 14px 16px; margin-bottom: 20px; }
  .notice-box .detail { color: #666; }

  .final-total { margin: 24px 0 18px; padding: 26px 22px; background: #fafafa; border: 1px solid #1a1a1a; border-radius: 2px; text-align: center; }
  .final-total .ft { font-size: 11px; color: #666; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  .final-total .fn { font-size: 30px; font-weight: 500; }
  .final-total .fh { font-size: 12px; color: #999; margin-top: 6px; }

  .main-actions { display: flex; gap: 12px; }
  .act-btn { flex: 1; padding: 16px; border-radius: 2px; cursor: pointer; font-size: 14px; letter-spacing: 2px; }
  .copy-all { background: #1a1a1a; color: #fff; border: 1px solid #1a1a1a; }
  .copy-all:hover { background: #000; }
  .restart { background: #fff; color: #1a1a1a; border: 1px solid #d9d9d9; }
  .restart:hover { border-color: #1a1a1a; }

  .policy-note { margin-top: 22px; padding-top: 14px; border-top: 1px solid #f0f0f0; font-size: 11px; color: #9a9a9a; line-height: 1.9; letter-spacing: .2px; }
</style>
<style>
  /* === BB currency + brand footer === */
  .bb-ccy{display:flex;justify-content:center;margin:0 0 24px;}
  .bb-ccy-btn{border:1px solid #1a1a1a;background:#fff;color:#666;padding:9px 18px;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .bb-ccy-btn:first-child{border-right:none;border-radius:2px 0 0 2px;}
  .bb-ccy-btn:last-child{border-radius:0 2px 2px 0;}
  .bb-ccy-btn.active{background:#1a1a1a;color:#fff;}
  .bb-c{font-weight:500;}
  .bb-brand-footer{text-align:center;margin-top:22px;padding-top:16px;border-top:1px solid #1a1a1a;}
  .bb-brand-footer .bb-slogan{font-size:10px;letter-spacing:4px;color:#666;text-transform:uppercase;}
  .bb-brand-footer .bb-sub{font-size:8px;letter-spacing:2px;color:#bbb;margin-top:6px;text-transform:uppercase;}
  .bb-pay-note{margin-top:18px;padding:14px 16px;border:1px solid #1a1a1a;border-radius:2px;font-size:11px;color:#666;line-height:1.9;letter-spacing:.2px;text-align:left;}
  .bb-pay-note .bb-pay-title{font-size:10px;letter-spacing:3px;color:#1a1a1a;margin-bottom:8px;text-transform:uppercase;}
</style>
<script>
(function(){
  var RATE={twd:4.9432,hkd:1.1769};
  var c=localStorage.getItem('bb_ccy')||'twd';
  if(!RATE[c])c='twd';
  window.BB_CCY=c;
  window.bbMoney=function(cny){
    var n=Math.round(Number(cny)*RATE[window.BB_CCY]);
    var sym=window.BB_CCY==='twd'?'NT$':'HK$';
    return sym+n.toLocaleString('en-US');
  };
  window.bbCNYFmt=function(cny){
    return '¥'+Math.round(Number(cny)).toLocaleString('en-US');
  };
  document.addEventListener('DOMContentLoaded',function(){
    var nodes=document.querySelectorAll('.bb-c');
    for(var i=0;i<nodes.length;i++){nodes[i].textContent=window.bbMoney(nodes[i].getAttribute('data-cny'));}
    var btns=document.querySelectorAll('.bb-ccy-btn');
    for(var j=0;j<btns.length;j++){btns[j].classList.toggle('active',btns[j].getAttribute('data-c')===window.BB_CCY);}
    var bar=document.getElementById('bbCcyBar');
    if(bar){bar.addEventListener('click',function(e){
      var b=e.target.closest('.bb-ccy-btn');if(!b)return;
      var nc=b.getAttribute('data-c');if(nc===window.BB_CCY)return;
      localStorage.setItem('bb_ccy',nc);location.reload();
    });}
  });
})();
</script>

</head>

<div class="bb-pay-note">

      若您可透過支付寶直接以人民幣付款，或於淘寶下單，即以本頁顯示價格結算，不另收費用；若您選擇透過 PayPal 以港幣或台幣付款，將加收總價 5% 之手續費。
    </div>

  </div>

  <script>
    /* ===== 公共常量 ===== */
    const COLOR_NAME = {
      '#FFFFFF':'純白','#F5F0EB':'奶昔白','#9D5F3B':'金棕','#746148':'大象灰','#1E2E44':'午夜藍',
      '#000000':'黑色','#80412D':'焦糖棕','#3FBF72':'漫畫綠','#B3A59A':'風衣灰','#F27D3B':'橙色','#F27D3C':'橙色',
      '#F2C12E':'太陽黃','#F9E77F':'小雞黃','#404234':'橄欖綠','#BDE0F2':'微風藍','#A0E7E5':'tiffany藍',
      '#0D32C4':'克萊因藍','#91A3B1':'亞麻藍','#C0A086':'馬拉茶色','#8C8969':'鼠尾草綠','#808080':'積雨雲灰',
      '#BE3033':'大紅','#EEB9C9':'櫻花粉','#DF6981':'薔薇粉','#E4A3BB':'花瓣粉','#6A2A30':'酒紅',
      '#FFD700':'檸檬黃','#C6AEA6':'杏色','#294162':'深邃藍','#C0C0C0':'海鷗灰','#402D2D':'深咖',
      '#452E22':'野牛皮'
    };
    const GLOVE_AREA = {1:'手背正面',2:'正面手腕',3:'手心主體',4:'拇指外側上部',5:'拇指外側下部',6:'拇指內側',7:'手掌側條',8:'包邊'};
    const HEAD_ZONE = {
      split: {1:'左邊',2:'右邊',3:'左耳耳朵條',4:'左耳',5:'右耳耳朵條',6:'右耳',7:'包邊'},
      triple: {1:'中間',2:'兩側',3:'耳朵條',4:'耳朵',5:'包邊'}
    };
    const GLOVE_POS = {wristLeftLeft:'左手手腕內側·左側',wristLeftRight:'左手手腕內側·右側',wristRightLeft:'右手手腕內側·左側',wristRightRight:'右手手腕內側·右側'};
    const HEAD_SMALL_POS = {leftEar:'左耳',rightEar:'右耳',foreLeft:'額頭左側',foreRight:'額頭右側',other:'其它區域'};
    const GROIN_ZONE = {1:'左側',2:'右側',3:'左側包邊',4:'右側包邊',5:'繫帶左側',6:'繫帶右側'};
    const TYPE_LABEL = {glove:'拳套', head:'護頭', groin:'護襠'};
    const TYPE_RESULT = {glove:'g5.result.html', head:'h6.head-result.html', groin:'c5.groin-result.html'};

    const printText = v => ({gold:'燙金',silver:'燙銀',original:'原色燙印'}[v] || v);
    const engFontText = v => v === 'cursive' ? '花體' : '正體';
    const chFontText = v => v === 'song' ? '宋體' : '手寫體';
    const mixedFontText = v => v === 'cursive' ? '花體/手寫體' : '正字體/宋體';
    const stitchText = v => v === 'inner' ? '內縫' : '外縫';
    const cname = hex => COLOR_NAME[hex] || hex;
    const swatch = hex => `<span class="color-swatch" style="background:${hex};"></span>`;

    /* ===== 讀取套裝與各件數據 ===== */
    let suit;
    try { suit = JSON.parse(localStorage.getItem('bb_suit')); } catch (e) { suit = null; }
    if (!suit || !Array.isArray(suit.items) || !suit.items.length) {
      alert('未找到套裝數據，請先選擇產品');
      window.location.href = 'index.html';
    }
    function readItem(i){
      const pfx = 'bb_' + i + '_';
      const get = k => localStorage.getItem(pfx + k);
      const parse = (k,d) => { try { return JSON.parse(get(k)) || d; } catch (e) { return d; } };
      return {
        type: suit.items[i].type,
        size: get('size'),
        height: get('height'),
        weight: get('weight'),
        waist: get('waist'),
        leather: get('leatherType') || '未選擇',
        mode: get('mode') || 'triple',
        basePrice: parseInt(get('basePrice'),10) || 0,
        colorExtra: parseInt(get('colorExtra'),10) || 0,
        customExtra: parseInt(get('customExtra'),10) || 0,
        areaColors: parse('areaColors', {}),
        opt: parse('customOptions', {})
      };
    }
    /* ===== HTML 輔助 ===== */
    const line = (k,v) => `<div class="line"><span class="k">${k}</span><span class="v">${v}</span></div>`;
    const subTitle = t => `<div class="sub-title">${t}</div>`;
    const colorLine = (k,v) => `<div class="color-line"><span>${k}</span><span>${v}</span></div>`;
    const detail = s => `<div class="detail">${s}</div>`;

    /* ===== 拳套渲染 ===== */
    function gloveLogo(o){
      const lt = o.logoType || 'original';
      if (lt === 'text') {
        const tc = o.textContent || 'brand';
        if (tc === 'custom') {
          let s = `文字 Logo（正面手腕）· 自定義文字「${o.textLogoCustom}」· ${mixedFontText(o.textLogoFont)} · ${printText(o.textPrint)}`;
          if (/[一-龥]/.test(o.textLogoCustom || '')) s += '（漢字銅模 ' + bbMoney(30) + '）';
          return s;
        }
        return `文字 Logo（正面手腕）· 品牌文字 · ${printText(o.textPrint)}`;
      }
      if (lt === 'colored') return `其他顏色 Logo · ${cname(o.coloredLogo)} · ${stitchText(o.logoStitch)}`;
      if (lt === 'none') return '無 Logo';
      if (lt === 'embroidery') return '刺繡 Logo · 聯繫客服單獨報價';
      return `原色 Logo · ${stitchText(o.logoStitch)}`;
    }
    function buildGlove(d){
      const o = d.opt;
      const html = [];
      const text = [];
      const notices = [];

      html.push(line('拳套尺寸', d.size ? d.size + ' oz' : '未選擇'));
      html.push(line('皮革類型', d.leather));
      text.push('拳套尺寸：' + (d.size ? d.size + ' oz' : '未選擇'));
      text.push('皮革類型：' + d.leather);

      html.push(subTitle('各區域配色'));
      text.push('各區域配色：');
      for (let i = 1; i <= 8; i++) {
        const hex = d.areaColors[i];
        if (hex) { html.push(colorLine(i + '號 · ' + GLOVE_AREA[i], swatch(hex) + cname(hex))); text.push(`  ${i}號 ${GLOVE_AREA[i]}：${cname(hex)}`); }
        else html.push(colorLine(i + '號 · ' + GLOVE_AREA[i], '<span style="color:#ccc;">未選擇</span>'));
      }

      html.push(subTitle('Logo 配置'));
      html.push(detail(gloveLogo(o)));
      text.push('Logo 配置：');
      text.push('  ' + gloveLogo(o));

      html.push(subTitle('手腕內側印字'));
      text.push('手腕內側印字：');
      ['left','right'].forEach(side => {
        const lab = side === 'left' ? '左手' : '右手';
        let s;
        if (o[side + 'Eng']) s = `${lab}：英文/數字「${o[side+'Eng']}」· ${engFontText(o[side+'EngFont'])} · ${printText(o[side+'Print'])}`;
        else if (o[side + 'Ch']) s = `${lab}：漢字「${o[side+'Ch']}」· ${chFontText(o[side+'ChFont'])} · ${printText(o[side+'Print'])}（銅模 ${bbMoney(30)}）`;
        else s = `${lab}：未定製`;
        html.push(detail(s)); text.push('  ' + s);
      });

      html.push(subTitle('小圖案'));
      text.push('小圖案：');
      const sp = Array.isArray(o.smallPatterns) ? o.smallPatterns : [];
      if (sp.length) {
        sp.forEach((it, idx) => {
          let s;
          if (it.craft === 'embroidery') {
            s = `小圖案 ${idx+1}：刺繡（${GLOVE_POS[it.pos]||it.pos}，${bbMoney(100)}–${bbMoney(300)} 聯繫客服，不計入自動總價）`;
            notices.push('拳套小圖案 ' + (idx+1) + ' 刺繡：' + (GLOVE_POS[it.pos]||it.pos) + '，' + bbMoney(100) + '–' + bbMoney(300) + ' 按圖案報價');
          } else {
            s = `小圖案 ${idx+1}：燙印（${GLOVE_POS[it.pos]||it.pos}，${printText(it.print)}，+${bbMoney(30)}）`;
          }
          html.push(detail(s)); text.push('  ' + s);
        });
      } else { html.push(detail('未添加小圖案')); text.push('  未添加'); }

      const handS = o.handEmbroidery === 'yes'
        ? '已添加手背刺繡（' + bbMoney(100) + '–' + bbMoney(300) + '，提供圖案聯繫客服，不計入自動總價）'
        : '不添加';
      html.push(subTitle('手背刺繡'));
      html.push(detail(handS));
      text.push('手背刺繡：' + handS);
      if (o.handEmbroidery === 'yes') notices.push('拳套手背刺繡：' + bbMoney(100) + '–' + bbMoney(300) + ' 按圖案報價');

      if ((o.logoType === 'embroidery')) notices.push('拳套刺繡 Logo：按圖案複雜度單獨報價');
      if (/鯊魚|鱷魚|鴕鳥|蜥蜴/.test(d.leather)) notices.push('拳套稀有皮「' + d.leather + '」：最終皮料與價格以客服覈對爲準');

      html.push(line('基礎價格', bbMoney(d.basePrice)));
      html.push(line('配色額外費用', bbMoney(d.colorExtra)));
      html.push(line('定製額外費用', bbMoney(d.customExtra)));
      const total = d.basePrice + d.colorExtra + d.customExtra;
      text.push('費用：基礎 ' + bbMoney(d.basePrice) + ' + 配色 ' + bbMoney(d.colorExtra) + ' + 定製 ' + bbMoney(d.customExtra));
      text.push('本件小計（不含刺繡單獨報價）：' + bbMoney(total));
      return { html: html.join(''), text: text.join('\n'), total, notices };
    }
    /* ===== 護頭渲染 ===== */
    function headLogo(o){
      const lt = o.logoType;
      if (lt === 'text') {
        const tc = o.textContent || 'brand';
        if (tc === 'custom') {
          let s = `文字 Logo（正中間）· 自定義文字「${o.textLogoCustom}」· ${mixedFontText(o.textLogoFont)} · ${printText(o.textPrint)}`;
          if (/[一-龥]/.test(o.textLogoCustom || '')) s += '（漢字銅模 ' + bbMoney(30) + '）';
          return s;
        }
        return `文字 Logo（正中間）· 品牌文字 · ${printText(o.textPrint)}`;
      }
      if (lt === 'colored') return `其他顏色 Logo · ${cname(o.coloredLogo)}`;
      if (lt === 'none') return '無 Logo';
      if (lt === 'embroidery') return '刺繡 Logo · 聯繫客服單獨報價';
      return '原色 Logo · 外縫';
    }
    function headSmallPatterns(o){
      const norm = it => ({ pos: it.pos || 'leftEar', note: it.note || '', craft: it.craft || 'hot', print: it.print || 'gold' });
      if (Array.isArray(o.smallPatterns)) return o.smallPatterns.map(norm);
      if (o.smallPattern === 'yes') return [norm({ pos: o.smallPos, note: o.smallNote })];
      return [];
    }
    function buildHead(d){
      const o = d.opt;
      const html = [];
      const text = [];
      const notices = [];
      const layerCount = d.mode === 'split' ? 7 : 5;

      html.push(line('頭圍尺寸', d.size ? d.size + ' cm' : '未選擇'));
      html.push(line('皮革類型', d.leather));
      html.push(line('拼色方式', d.mode === 'split' ? '雙拼（左右對拼）' : '三拼（中間與兩側）'));
      text.push('頭圍尺寸：' + (d.size ? d.size + ' cm' : '未選擇'));
      text.push('皮革類型：' + d.leather);
      text.push('拼色方式：' + (d.mode === 'split' ? '雙拼（左右對拼）' : '三拼（中間與兩側）'));

      html.push(subTitle('各區域配色'));
      text.push('各區域配色：');
      for (let i = 1; i <= layerCount; i++) {
        const hex = d.areaColors[i];
        if (hex) { html.push(colorLine(i + '號 · ' + HEAD_ZONE[d.mode][i], swatch(hex) + cname(hex))); text.push(`  ${i}號 ${HEAD_ZONE[d.mode][i]}：${cname(hex)}`); }
        else html.push(colorLine(i + '號 · ' + HEAD_ZONE[d.mode][i], '<span style="color:#ccc;">未選擇</span>'));
      }

      html.push(subTitle('Logo 與燙印'));
      html.push(detail(headLogo(o)));
      text.push('Logo 與燙印：');
      text.push('  ' + headLogo(o));
      ['left','right'].forEach(side => {
        const lab = side === 'left' ? '左耳' : '右耳';
        let s;
        if (o[side + 'Eng']) s = `${lab}：英文/數字「${o[side+'Eng']}」· ${engFontText(o[side+'EngFont'])} · ${printText(o[side+'Print'])}`;
        else if (o[side + 'Ch']) s = `${lab}：漢字「${o[side+'Ch']}」· ${chFontText(o[side+'ChFont'])} · ${printText(o[side+'Print'])}（銅模 ${bbMoney(30)}）`;
        else s = `${lab}：未燙印`;
        html.push(detail(s)); text.push('  ' + s);
      });

      html.push(subTitle('其他定製'));
      text.push('其他定製：');
      const repS = o.logoReplace === 'yes' ? '已選擇（+' + bbMoney(70) + '）' : '未選擇';
      html.push(detail('Logo 替換：' + repS));
      text.push('  Logo 替換：' + repS);
      const sp = headSmallPatterns(o);
      if (sp.length) {
        sp.forEach((it, idx) => {
          let s;
          if (it.craft === 'embroidery') {
            s = `小圖案 ${idx+1}：刺繡（${HEAD_SMALL_POS[it.pos]||it.pos}，${bbMoney(100)}–${bbMoney(300)} 聯繫客服，不計入自動總價）`;
            notices.push('護頭小圖案 ' + (idx+1) + ' 刺繡：' + (HEAD_SMALL_POS[it.pos]||it.pos) + '，' + bbMoney(100) + '–' + bbMoney(300) + ' 按圖案報價');
          } else {
            s = `小圖案 ${idx+1}：燙印（${HEAD_SMALL_POS[it.pos]||it.pos}，${printText(it.print)}，+${bbMoney(30)}）`;
          }
          if (it.pos === 'other' && it.note) s += '，備註「' + it.note + '」';
          html.push(detail(s)); text.push('  ' + s);
        });
      } else { html.push(detail('小圖案：未添加')); text.push('  小圖案：未添加'); }

      html.push(line('基礎價格', bbMoney(d.basePrice)));
      html.push(line('配色額外費用', bbMoney(d.colorExtra)));
      html.push(line('定製額外費用', bbMoney(d.customExtra)));
      const total = d.basePrice + d.colorExtra + d.customExtra;
      text.push('費用：基礎 ' + bbMoney(d.basePrice) + ' + 配色 ' + bbMoney(d.colorExtra) + ' + 定製 ' + bbMoney(d.customExtra));
      text.push('本件小計（不含刺繡單獨報價）：' + bbMoney(total));

      if (o.logoType === 'embroidery') notices.push('護頭刺繡 Logo：按圖案複雜度單獨報價');
      if (/鯊魚|鱷魚|鴕鳥|蜥蜴/.test(d.leather)) notices.push('護頭稀有皮「' + d.leather + '」：最終皮料與價格以客服覈對爲準');
      return { html: html.join(''), text: text.join('\n'), total, notices };
    }

    /* ===== 護襠渲染 ===== */
    function buildGroin(d){
      const html = [];
      const text = [];
      const notices = [];

      html.push(line('身高', d.height ? d.height + ' cm' : '未選擇'));
      html.push(line('體重', d.weight ? d.weight + ' kg' : '未選擇'));
      html.push(line('腰圍', d.waist ? d.waist + ' cm' : '未選擇'));
      html.push(line('皮革類型', d.leather));
      text.push('身高：' + (d.height ? d.height + ' cm' : '未選擇'));
      text.push('體重：' + (d.weight ? d.weight + ' kg' : '未選擇'));
      text.push('腰圍：' + (d.waist ? d.waist + ' cm' : '未選擇'));
      text.push('皮革類型：' + d.leather);

      html.push(subTitle('各區域配色'));
      text.push('各區域配色：');
      for (let i = 1; i <= 6; i++) {
        const hex = d.areaColors[i];
        if (hex) { html.push(colorLine(i + '號 · ' + GROIN_ZONE[i], swatch(hex) + cname(hex))); text.push(`  ${i}號 ${GROIN_ZONE[i]}：${cname(hex)}`); }
        else html.push(colorLine(i + '號 · ' + GROIN_ZONE[i], '<span style="color:#ccc;">未選擇</span>'));
      }

      const o = d.opt || {};
      html.push(subTitle('Logo 與圖案'));
      text.push('Logo 與圖案：');
      const GROIN_LOGO_LABEL = { original:'原色 Logo（外縫）', colored:'其他顏色 Logo（外縫）', none:'無 Logo', embroidery:'刺繡 Logo' };
      const lt = o.logoType || 'original';
      let mainS = GROIN_LOGO_LABEL[lt] || lt;
      if (lt === 'colored') mainS += ' · ' + cname(o.coloredLogo);
      if (lt === 'embroidery') { mainS += '（單獨報價，不計自動價）'; notices.push('護襠刺繡 Logo：按圖案複雜度單獨報價'); }
      html.push(detail('Logo 款式：' + mainS)); text.push('  Logo 款式：' + mainS);
      if (lt === 'original' || lt === 'colored') {
        const repS = o.logoReplace === 'yes' ? '替換爲自有圖案（+' + bbMoney(70) + '）' : '保留品牌 Logo';
        html.push(detail('圖案來源：' + repS)); text.push('  圖案來源：' + repS);
      }
      const gp = o.groinPatterns || {};
      [['frontLeft','正面左側'],['frontRight','正面右側']].forEach(([key,nm]) => {
        const it = gp[key];
        let s;
        if (!it || !it.craft || it.craft === 'none') s = nm + '：不添加';
        else if (it.craft === 'hot') s = nm + '：燙印（' + printText(it.print) + '，+' + bbMoney(30) + '）';
        else { s = nm + '：刺繡（' + bbMoney(100) + '–' + bbMoney(300) + ' 聯繫客服，不計自動價）'; notices.push('護襠' + nm + '刺繡：按圖案報價'); }
        html.push(detail(s)); text.push('  ' + s);
      });

      html.push(line('基礎價格', bbMoney(d.basePrice)));
      html.push(line('配色額外費用', bbMoney(d.colorExtra)));
      html.push(line('定製額外費用', bbMoney(d.customExtra)));
      const total = d.basePrice + d.colorExtra + d.customExtra;
      text.push('費用：基礎 ' + bbMoney(d.basePrice) + ' + 配色 ' + bbMoney(d.colorExtra) + ' + 定製 ' + bbMoney(d.customExtra));
      text.push('本件小計（不含刺繡單獨報價）：' + bbMoney(total));
      return { html: html.join(''), text: text.join('\n'), total, notices };
    }

    /* ===== 主渲染循環 ===== */
    if (suit) {
    const wrap = document.getElementById('itemsWrap');
    const allNotices = [];
    const allText = [];
    let grand = 0;
    suit.items.forEach((it, i) => {
      const d = readItem(i);
      let r;
      if (d.type === 'glove') r = buildGlove(d);
      else if (d.type === 'groin') r = buildGroin(d);
      else r = buildHead(d);
      grand += r.total;
      allNotices.push(...r.notices);

      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML =
        `<div class="item-head"><span class="t">第 ${i+1} 件 · ${TYPE_LABEL[d.type]}</span><span class="sub">${d.leather}</span></div>` +
        `<div class="item-body">${r.html}</div>` +
        `<div class="item-subtotal"><span>本件小計</span><b>${bbMoney(r.total)}</b></div>` +
        `<div class="edit-link"><button class="edit-btn" type="button" data-edit="${i}">返回修改本件</button></div>`;
      wrap.appendChild(card);

      allText.push('【第 ' + (i+1) + ' 件 · ' + TYPE_LABEL[d.type] + '】');
      allText.push(r.text);
      allText.push('');
    });

    document.getElementById('grandTotal').textContent = bbMoney(grand);
    document.getElementById('pageSub').textContent = '共 ' + suit.items.length + ' 件，套裝自動價合計 ' + bbMoney(grand);

    const noticeBox = document.getElementById('noticeBox');
    if (allNotices.length) {
      noticeBox.innerHTML = '<div class="sub-title" style="margin-top:0;">單獨報價 / 需客服覈對項</div>' +
        allNotices.map(n => `<div class="detail">· ${n}</div>`).join('');
    } else {
      noticeBox.style.display = 'none';
    }

    /* ===== 返回修改 ===== */
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.edit, 10);
        suit.current = i;
        localStorage.setItem('bb_suit', JSON.stringify(suit));
        window.location.href = 'pages/' + TYPE_RESULT[suit.items[i].type];
      });
    });

    /* ===== 複製全部 ===== */
    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); alert('全部方案已複製，可直接發送給客服'); }
      catch (e) { alert('複製失敗，請手動複製'); }
      document.body.removeChild(ta);
    }
    document.getElementById('copyAllBtn').onclick = () => {
      const out = [];
      out.push('BUFFALO BOXING · Darwin 系列套裝定製方案（共 ' + suit.items.length + ' 件）');
      out.push('════════════════════');
      out.push(allText.join('\n'));
      out.push('════════════════════');
      out.push('套裝自動價合計（不含刺繡、特殊皮擴展等單獨報價）：' + bbMoney(grand));
      out.push('約等於 ' + window.bbCNYFmt(grand) + ' 人民幣');
      if (allNotices.length) {
        out.push('需客服覈對 / 單獨報價項：');
        allNotices.forEach(n => out.push('· ' + n));
      }
      const text = out.join('\n');
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(
          () => alert('全部方案已複製，可直接發送給客服'),
          () => fallbackCopy(text)
        );
      } else {
        fallbackCopy(text);
      }
    };

    /* ===== 重新選擇 ===== */
    document.getElementById('restartBtn').onclick = () => {
      window.location.href = 'index.html';
    };
    }
  </script>
</body>
</html>
