<head>

<title>Logo 與圖案 · BUFFALO BOXING 護襠定製</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 40px 20px; max-width: 750px; margin: 0 auto; background: #fafafa; color: #1a1a1a; line-height: 1.6;
  }
  .page-frame { background: #fff; border: 1px solid #1a1a1a; border-radius: 2px; padding: 32px 20px; }
  @media (min-width: 768px) { .page-frame { padding: 48px 40px; } }
  .brand-header { text-align: center; margin-bottom: 44px; padding-bottom: 24px; border-bottom: 1px solid #1a1a1a; }
  .brand-name { font-size: 20px; font-weight: 600; letter-spacing: 3px; }
  .brand-series { font-size: 11px; letter-spacing: 4px; color: #666; margin-top: 6px; text-transform: uppercase; }

  .step-tag { font-size: 11px; letter-spacing: 3px; color: #999; text-transform: uppercase; margin-bottom: 10px; }
  .page-title { font-size: 20px; font-weight: 500; margin-bottom: 22px; letter-spacing: 1px; }
  .current-price { font-size: 14px; color: #666; margin-bottom: 30px; padding-bottom: 16px; border-bottom: 1px solid #1a1a1a; }
  .current-price span { font-size: 22px; font-weight: 500; color: #1a1a1a; margin-left: 8px; }

  .section { margin-bottom: 36px; padding-bottom: 30px; border-bottom: 1px solid #e5e5e5; }
  .section:last-of-type { border-bottom: none; padding-bottom: 0; margin-bottom: 32px; }
  .section-title { font-size: 15px; font-weight: 500; margin-bottom: 18px; letter-spacing: .5px; }
  .option-label { font-weight: 500; margin: 14px 0 9px; font-size: 14px; color: #333; display: block; }
  .radio-group { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
  .radio-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #333; cursor: pointer; }
  .radio-item input[type="radio"] {
    appearance: none; -webkit-appearance: none; width: 16px; height: 16px;
    border: 1px solid #b3b3b3; border-radius: 50%; cursor: pointer; position: relative; transition: border-color .2s;
  }
  .radio-item input[type="radio"]:checked { border-color: #1a1a1a; }
  .radio-item input[type="radio"]:checked::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 8px; height: 8px; border-radius: 50%; background: #1a1a1a;
  }
  select { padding: 12px; border: 1px solid #d9d9d9; border-radius: 2px; width: 100%; background: #fff; font-size: 14px; font-family: inherit; outline: none; margin: 6px 0; }
  select:focus { border-color: #1a1a1a; }
  .sub-box { display: none; margin-top: 14px; padding: 16px 18px; border: 1px solid #d9d9d9; border-radius: 2px; background: #fafafa; }
  .sub-box.show { display: block; }
  .note { font-size: 12px; color: #999; margin: 8px 0 0; line-height: 1.6; }
  .price-tag { font-size: 13px; font-weight: 500; }
  .warning { font-size: 12px; padding: 11px 14px; border: 1px solid #d9d9d9; border-radius: 2px; background: #fafafa; margin: 10px 0; line-height: 1.6; display: none; }

  .pattern-card { border: 1px solid #d9d9d9; border-radius: 2px; padding: 16px; margin-bottom: 14px; background: #fafafa; }
  .pattern-name { font-size: 14px; font-weight: 500; color: #1a1a1a; margin-bottom: 6px; }
  .pattern-detail { display: none; margin-top: 12px; }
  .pattern-detail.show { display: block; }

  .btn-group { display: flex; gap: 12px; }
  .prev-btn, .next-btn { flex: 1; padding: 16px; border-radius: 2px; cursor: pointer; font-size: 14px; letter-spacing: 2px; transition: all .2s; }
  .prev-btn { background: #fff; color: #1a1a1a; border: 1px solid #d9d9d9; }
  .prev-btn:hover { border-color: #1a1a1a; }
  .next-btn { background: #1a1a1a; color: #fff; border: 1px solid #1a1a1a; }
  .next-btn:hover { background: #000; border-color: #000; }
  .step-nav { display: flex; gap: 8px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .step-nav::-webkit-scrollbar { height: 3px; }
  .step-nav-item { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 9px 13px; background: #fff; font-size: 12px; letter-spacing: 1px; color: #666; cursor: pointer; font-family: inherit; transition: all .2s ease; }
  .step-nav-item .sn-num { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border: 1px solid #999; border-radius: 50%; font-size: 10px; }
  .step-nav-item:hover { border-color: #1a1a1a; color: #1a1a1a; }
  .step-nav-item.current { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
  .step-nav-item.current .sn-num { border-color: #fff; }
  .mem-logo-btn { border:1px solid #1a1a1a; background:#fff; color:#1a1a1a; border-radius:2px; padding:10px 14px; font-size:12px; letter-spacing:1px; cursor:pointer; font-family:inherit; margin-bottom:18px; transition:all .2s; }
  .mem-logo-btn:hover { background:#1a1a1a; color:#fff; }
  .mem-text-cap { font-size:10px; letter-spacing:1px; color:#aaa; margin:8px 0 4px; }
  .mem-text-row { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 6px; }
  .mem-text-chip { border:1px solid #d9d9d9; background:#fafafa; border-radius:2px; padding:5px 10px; font-size:12px; color:#555; cursor:pointer; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mem-text-chip:hover { border-color:#1a1a1a; color:#1a1a1a; }
    .global-nav { display:flex; gap:10px; margin-top:24px; padding-top:18px; border-top:1px solid #f0f0f0; }
    .gn-link { flex:1; text-align:center; border:1px solid #d9d9d9; border-radius:2px; padding:13px 8px; font-size:12px; letter-spacing:1px; color:#666; background:#fff; text-decoration:none; cursor:pointer; transition:all .2s; }
    .gn-link:hover { border-color:#1a1a1a; color:#1a1a1a; }
    .gn-link.gn-bundle { border-color:#1a1a1a; color:#1a1a1a; display:none; }
    .gn-link.gn-bundle:hover { background:#1a1a1a; color:#fff; }
</style>
<style>
  /* === BB currency + brand footer === */
  .bb-ccy{display:flex;justify-content:center;margin:0 0 24px;}
  .bb-ccy-btn{border:1px solid #1a1a1a;background:#fff;color:#666;padding:9px 18px;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .bb-ccy-btn:first-child{border-right:none;border-radius:2px 0 0 2px;}
  .bb-ccy-btn:last-child{border-radius:0 2px 2px 0;}
  .bb-ccy-btn.active{background:#1a1a1a;color:#fff;}
  .bb-c{font-weight:500;}
  .bb-brand-footer{text-align:center;margin-top:22px;padding-top:16px;border-top:1px solid #1a1a1a;}
  .bb-brand-footer .bb-slogan{font-size:10px;letter-spacing:4px;color:#666;text-transform:uppercase;}
  .bb-brand-footer .bb-sub{font-size:8px;letter-spacing:2px;color:#bbb;margin-top:6px;text-transform:uppercase;}
</style>
<script>
(function(){
  var RATE={twd:4.9432,hkd:1.1769};
  var c=localStorage.getItem('bb_ccy')||'twd';
  if(!RATE[c])c='twd';
  window.BB_CCY=c;
  window.bbMoney=function(cny){
    var n=Math.round(Number(cny)*RATE[window.BB_CCY]);
    var sym=window.BB_CCY==='twd'?'NT$':'HK$';
    return sym+n.toLocaleString('en-US');
  };
  window.bbCNYFmt=function(cny){
    return '¥'+Math.round(Number(cny)).toLocaleString('en-US');
  };
  document.addEventListener('DOMContentLoaded',function(){
    var nodes=document.querySelectorAll('.bb-c');
    for(var i=0;i<nodes.length;i++){nodes[i].textContent=window.bbMoney(nodes[i].getAttribute('data-cny'));}
    var btns=document.querySelectorAll('.bb-ccy-btn');
    for(var j=0;j<btns.length;j++){btns[j].classList.toggle('active',btns[j].getAttribute('data-c')===window.BB_CCY);}
    var bar=document.getElementById('bbCcyBar');
    if(bar){bar.addEventListener('click',function(e){
      var b=e.target.closest('.bb-ccy-btn');if(!b)return;
      var nc=b.getAttribute('data-c');if(nc===window.BB_CCY)return;
      localStorage.setItem('bb_ccy',nc);location.reload();
    });}
  });
})();
</script>

</head>

  <script>
    /* ===== 統一存儲封裝（每件獨立前綴） ===== */
    const BBSUIT_KEY = 'bb_suit';
    function BB_suit(){ try{ return JSON.parse(localStorage.getItem(BBSUIT_KEY)) || null; }catch(e){ return null; } }
    function BB_prefix(){
      const s = BB_suit();
      if(!s || !Array.isArray(s.items) || !s.items.length) return '';
      const idx = (typeof s.current === 'number') ? s.current : 0;
      return 'bb_' + idx + '_';
    }
    const LS = {
      get(k){ return localStorage.getItem(BB_prefix() + k); },
      set(k,v){ localStorage.setItem(BB_prefix() + k, v); },
      remove(k){ localStorage.removeItem(BB_prefix() + k); }
    };

    /* ============ 基礎狀態 ============ */
    const leatherType = LS.get('leatherType') || '';
    const isWild = leatherType.includes('野牛皮');
    const COLORS = [
      ['#FFFFFF','純白'],['#F5F0EB','奶昔白'],['#9D5F3B','金棕'],['#746148','大象灰'],['#1E2E44','午夜藍'],
      ['#000000','黑色'],['#80412D','焦糖棕'],['#3FBF72','漫畫綠'],['#B3A59A','風衣灰'],['#F27D3B','橙色'],
      ['#F2C12E','太陽黃'],['#F9E77F','小雞黃'],['#404234','橄欖綠'],['#BDE0F2','微風藍'],['#A0E7E5','tiffany藍'],
      ['#0D32C4','克萊因藍'],['#91A3B1','亞麻藍'],['#C0A086','馬拉茶色'],['#8C8969','鼠尾草綠'],['#808080','積雨雲灰'],
      ['#BE3033','大紅'],['#EEB9C9','櫻花粉'],['#DF6981','薔薇粉'],['#E4A3BB','花瓣粉'],['#6A2A30','酒紅'],
      ['#FFD700','檸檬黃'],['#C6AEA6','杏色'],['#294162','深邃藍'],['#C0C0C0','海鷗灰'],['#402D2D','深咖']
    ];

    let areaColors = {};
    try { areaColors = JSON.parse(LS.get('areaColors')) || {}; } catch (e) {}
    const usedHex = new Set(Object.values(areaColors).filter(Boolean));

    const currentPriceEl = document.getElementById('currentPrice');
    const basePrice = parseInt(LS.get('basePrice'),10) || 0;
    const colorExtra = parseInt(LS.get('colorExtra'),10) || 0;

    /* ============ 主 Logo 元素 ============ */
    const coloredBox = document.getElementById('coloredLogoBox');
    const replaceBox = document.getElementById('replaceBox');
    const embroideryLogoNote = document.getElementById('embroideryLogoNote');
    const coloredSelect = document.getElementById('coloredLogoSelect');
    COLORS.forEach(([hex, nm]) => {
      const inUse = usedHex.has(hex);
      const o = document.createElement('option');
      o.value = hex;
      o.textContent = nm + ' · ' + (inUse ? '護襠已選（免費）' : '新顏色（+' + bbMoney(50) + '）');
      coloredSelect.appendChild(o);
    });
    const coloredNote = document.getElementById('coloredLogoNote');
    function refreshColoredNote() {
      const hex = coloredSelect.value;
      coloredNote.textContent = usedHex.has(hex)
        ? '該顏色護襠已使用，Logo 不額外收費。'
        : '該顏色護襠未使用，Logo 額外 +' + bbMoney(50) + '。';
    }
    coloredSelect.addEventListener('change', () => { refreshColoredNote(); calc(); });

    const logoTypeValue = () => {
      const el = document.querySelector('input[name="logoType"]:checked');
      return el ? el.value : 'original';
    };

    /* ============ 正面圖案（固定兩位置，每位置一個） ============ */
    const PATTERN_POS = [['frontLeft','正面左側'],['frontRight','正面右側']];
    let patterns = {
      frontLeft: { craft: 'none', print: 'gold' },
      frontRight: { craft: 'none', print: 'gold' }
    };

    function renderPatterns() {
      const box = document.getElementById('patternBox');
      box.innerHTML = '';
      PATTERN_POS.forEach(([key, nm]) => {
        const st = patterns[key];
        const card = document.createElement('div');
        card.className = 'pattern-card';
        const craftName = 'craft_' + key;
        const printName = 'print_' + key;
        const originalOption = isWild
          ? '<label class="radio-item"><input type="radio" name="' + printName + '" value="original" ' + (st.print==='original'?'checked':'') + '> 原色（野牛皮專用）</label>'
          : '';
        card.innerHTML =
          '<div class="pattern-name">' + nm + '</div>' +
          '<span class="option-label">工藝</span>' +
          '<div class="radio-group">' +
            '<label class="radio-item"><input type="radio" name="' + craftName + '" value="none" ' + (st.craft==='none'?'checked':'') + '> 不添加</label>' +
            '<label class="radio-item"><input type="radio" name="' + craftName + '" value="hot" ' + (st.craft==='hot'?'checked':'') + '> 燙印（' + bbMoney(30) + '）</label>' +
            '<label class="radio-item"><input type="radio" name="' + craftName + '" value="embroidery" ' + (st.craft==='embroidery'?'checked':'') + '> 刺繡</label>' +
          '</div>' +
          '<div class="pattern-detail' + (st.craft==='hot'?' show':'') + '">' +
            '<span class="option-label">燙印顏色</span>' +
            '<div class="radio-group">' +
              '<label class="radio-item"><input type="radio" name="' + printName + '" value="gold" ' + (st.print==='gold'?'checked':'') + '> 燙金</label>' +
              '<label class="radio-item"><input type="radio" name="' + printName + '" value="silver" ' + (st.print==='silver'?'checked':'') + '> 燙銀</label>' +
              originalOption +
            '</div>' +
            '<div class="note">僅支持簡單線稿圖。</div>' +
          '</div>' +
          '<div class="pattern-detail' + (st.craft==='embroidery'?' show':'') + '">' +
            '<div class="note">刺繡按圖案複雜度報價 ' + bbMoney(100) + '–' + bbMoney(300) + '/個，聯繫客服確認，不計入自動總價。</div>' +
          '</div>';
        box.appendChild(card);
      });
    }
    document.getElementById('patternBox').addEventListener('change', e => {
      if (!e.target.name) return;
      if (e.target.name.indexOf('craft_') === 0) {
        const key = e.target.name.replace('craft_', '');
        patterns[key].craft = e.target.value;
        if (e.target.value === 'hot' && !patterns[key].print) patterns[key].print = 'gold';
        renderPatterns(); calc();
      } else if (e.target.name.indexOf('print_') === 0) {
        const key = e.target.name.replace('print_', '');
        patterns[key].print = e.target.value;
        calc();
      }
    });

    /* ============ Logo 款式切換 ============ */
    function onLogoTypeChange() {
      const v = logoTypeValue();
      coloredBox.classList.toggle('show', v === 'colored');
      replaceBox.classList.toggle('show', v === 'original' || v === 'colored');
      embroideryLogoNote.style.display = v === 'embroidery' ? 'block' : 'none';
      calc();
    }
    document.getElementById('logoTypeGroup').addEventListener('change', onLogoTypeChange);
    document.querySelectorAll('input[name="logoReplace"]').forEach(r => {
      r.addEventListener('change', calc);
    });

    /* ============ 計費 ============ */
    function calc() {
      let customExtra = 0;
      const lt = logoTypeValue();
      if (lt === 'colored' && !usedHex.has(coloredSelect.value)) customExtra += 50;
      const replaceEl = document.querySelector('input[name="logoReplace"]:checked');
      if (replaceEl && replaceEl.value === 'yes') customExtra += 70;
      PATTERN_POS.forEach(([key]) => { if (patterns[key].craft === 'hot') customExtra += 30; });
      LS.set('customExtra', customExtra);
      currentPriceEl.textContent = bbMoney(basePrice + colorExtra + customExtra);
    }

    /* ============ 保存 ============ */
    function saveOptions() {
      const get = name => { const el = document.querySelector('input[name="'+name+'"]:checked'); return el ? el.value : ''; };
      const data = {
        logoType: get('logoType'),
        coloredLogo: coloredSelect.value,
        logoReplace: get('logoReplace'),
        groinPatterns: patterns
      };
      LS.set('customOptions', JSON.stringify(data));
      MEM_setLogo({logoType:data.logoType,coloredLogo:data.coloredLogo,logoReplace:data.logoReplace});
    }

    /* ============ 恢復 ============ */
    function restoreOptions() {
      let data;
      try { data = JSON.parse(LS.get('customOptions')); } catch (e) { return; }
      if (!data) return;
      const check = (name, val) => {
        if (!val) return;
        const el = document.querySelector('input[name="'+name+'"][value="'+val+'"]');
        if (el) el.checked = true;
      };
      check('logoType', data.logoType);
      if (data.coloredLogo) coloredSelect.value = data.coloredLogo;
      check('logoReplace', data.logoReplace);
      if (data.groinPatterns) {
        Object.keys(patterns).forEach(k => {
          if (data.groinPatterns[k]) patterns[k] = data.groinPatterns[k];
        });
      }
      renderPatterns();
      onLogoTypeChange();
      refreshColoredNote();
    }

    /* ============ 導航 ============ */
    document.getElementById('prevBtn').onclick = () => {
      saveOptions();
      window.location.href = 'c3.groin-color.html';
    };
    document.getElementById('nextBtn').onclick = () => {
      saveOptions();
      window.location.href = 'c5.groin-result.html';
    };

    /* ============ 初始化 ============ */
    restoreOptions();
    renderPatterns();
    onLogoTypeChange();
    refreshColoredNote();
    calc();
      window.__bbSave = saveOptions;
    document.getElementById('stepNav').addEventListener('click', function(e){
      const it = e.target.closest('.step-nav-item');
      if (!it) return;
      try { if (window.__bbSave) window.__bbSave(); } catch(err){}
      window.location.href = it.dataset.href;
    });
    /* ===== 全局記憶庫 bb_memory（跨裝備共享，不隨件前綴隔離） ===== */
    function MEM_get(){ try{ return JSON.parse(localStorage.getItem('bb_memory')) || {colors:[],texts:[],logo:null}; }catch(e){ return {colors:[],texts:[],logo:null}; } }
    function MEM_save(m){ localStorage.setItem('bb_memory', JSON.stringify(m)); }
    /* ===== 記憶庫擴展：文字與 Logo 快照 ===== */
    function MEM_addText(t){
      t=(t||'').trim(); if(!t) return;
      const m=MEM_get();
      m.texts=m.texts.filter(x=>x!==t);
      m.texts.unshift(t); m.texts=m.texts.slice(0,6);
      MEM_save(m);
    }
    function MEM_setLogo(snap){ const m=MEM_get(); m.logo=snap; MEM_save(m); }
    function applyMemLogo(){
      const snap=MEM_get().logo;
      if(!snap){ alert('還沒有可沿用的 Logo 設置，請先完成上一件'); return; }
      const setRadio=(name,val)=>{
        if(!val) return;
        const el=document.querySelector('input[name="'+name+'"][value="'+val+'"]');
        if(el && !el.disabled){ el.checked=true; el.dispatchEvent(new Event('change',{bubbles:true})); }
      };
      ['logoType','textContent','textLogoFont','textPrint','logoStitch','logoReplace'].forEach(n=>setRadio(n,snap[n]));
      if(snap.coloredLogo && typeof coloredSelect!=='undefined' && coloredSelect){
        try{ coloredSelect.value=snap.coloredLogo; coloredSelect.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
      }
      if(typeof onLogoTypeChange==='function') onLogoTypeChange();
      if(typeof calc==='function') calc();
    }
    document.getElementById('memLogoBtn').addEventListener('click', applyMemLogo);
</script>

    (function(){
      try{
        var st=BB_suit();
        var b=document.getElementById('gnBundle');
        if(b && st && st.mode==='suit') b.style.display='inline-block';
      }catch(e){}
    })();
  </script>
