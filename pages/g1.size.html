<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUFFALO BOXING拳擊裝備定製方案</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      padding: 40px 20px; 
      max-width: 750px; 
      margin: 0 auto; 
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }
    /* 復古黑邊外框容器 */
    .page-frame {
      background: #ffffff;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
      padding: 48px 40px;
    }
    /* 品牌頭部 */
    .brand-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 24px;
      border-bottom: 1px solid #1a1a1a;
    }
    .brand-name {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #1a1a1a;
    }
    .brand-series {
      font-size: 11px;
      letter-spacing: 4px;
      color: #666;
      margin-top: 6px;
      text-transform: uppercase;
    }
    .page-title { 
      font-size: 20px; 
      font-weight: 500; 
      margin-bottom: 36px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }
    /* 統一尺寸按鈕：兩列等寬網格 */
    .size-list { 
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 60px; 
    }
    .size-item { 
      border: 1px solid #d9d9d9; 
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px; 
      cursor: pointer;
      font-size: 15px;
      color: #333;
      transition: all 0.2s ease;
      background: #fff;
    }
    .size-item:hover {
      border-color: #1a1a1a;
      color: #1a1a1a;
    }
    .size-item.active { 
      border-color: #1a1a1a; 
      background: #fafafa; 
      color: #1a1a1a;
      font-weight: 500;
    }
    .next-btn { 
      width: 100%; 
      background: #1a1a1a; 
      color: #fff; 
      border: 1px solid #1a1a1a;
      padding: 16px; 
      border-radius: 2px; 
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }
    .next-btn:hover {
      background: #000;
      border-color: #000;
    }
      .copy-prev-btn {
      width: 100%; margin-bottom: 28px; padding: 14px; border: 1px solid #1a1a1a; border-radius: 2px;
      background: #fff; color: #1a1a1a; font-size: 13px; letter-spacing: 1px; cursor: pointer;
      font-family: inherit; transition: all .2s ease;
    }
    .copy-prev-btn:hover { background: #1a1a1a; color: #fff; }
    .step-nav {
      display: flex; gap: 8px; margin-bottom: 30px; overflow-x: auto;
      padding-bottom: 4px; -webkit-overflow-scrolling: touch;
    }
    .step-nav::-webkit-scrollbar { height: 3px; }
    .step-nav-item {
      flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
      border: 1px solid #d9d9d9; border-radius: 2px; padding: 9px 13px;
      background: #fff; font-size: 12px; letter-spacing: 1px; color: #666;
      cursor: pointer; font-family: inherit; transition: all .2s ease;
    }
    .step-nav-item .sn-num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border: 1px solid #999; border-radius: 50%; font-size: 10px;
    }
    .step-nav-item:hover { border-color: #1a1a1a; color: #1a1a1a; }
    .step-nav-item.current { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .step-nav-item.current .sn-num { border-color: #fff; }
    .global-nav { display:flex; gap:10px; margin-top:24px; padding-top:18px; border-top:1px solid #f0f0f0; }
    .gn-link { flex:1; text-align:center; border:1px solid #d9d9d9; border-radius:2px; padding:13px 8px; font-size:12px; letter-spacing:1px; color:#666; background:#fff; text-decoration:none; cursor:pointer; transition:all .2s; }
    .gn-link:hover { border-color:#1a1a1a; color:#1a1a1a; }
    .gn-link.gn-bundle { border-color:#1a1a1a; color:#1a1a1a; display:none; }
    .gn-link.gn-bundle:hover { background:#1a1a1a; color:#fff; }
</style>
<style>
  /* === BB currency + brand footer === */
  .bb-ccy{display:flex;justify-content:center;margin:0 0 24px;}
  .bb-ccy-btn{border:1px solid #1a1a1a;background:#fff;color:#666;padding:9px 18px;font-size:11px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .15s;}
  .bb-ccy-btn:first-child{border-right:none;border-radius:2px 0 0 2px;}
  .bb-ccy-btn:last-child{border-radius:0 2px 2px 0;}
  .bb-ccy-btn.active{background:#1a1a1a;color:#fff;}
  .bb-c{font-weight:500;}
  .bb-brand-footer{text-align:center;margin-top:22px;padding-top:16px;border-top:1px solid #1a1a1a;}
  .bb-brand-footer .bb-slogan{font-size:10px;letter-spacing:4px;color:#666;text-transform:uppercase;}
  .bb-brand-footer .bb-sub{font-size:8px;letter-spacing:2px;color:#bbb;margin-top:6px;text-transform:uppercase;}
  .bb-pay-note{margin-top:18px;padding:14px 16px;border:1px solid #1a1a1a;border-radius:2px;font-size:11px;color:#666;line-height:1.9;letter-spacing:.2px;text-align:left;}
  .bb-pay-note .bb-pay-title{font-size:10px;letter-spacing:3px;color:#1a1a1a;margin-bottom:8px;text-transform:uppercase;}
</style>
<script>
(function(){
  var RATE={twd:4.9432,hkd:1.1769};
  var c=localStorage.getItem('bb_ccy')||'twd';
  if(!RATE[c])c='twd';
  window.BB_CCY=c;
  window.bbMoney=function(cny){
    var n=Math.round(Number(cny)*RATE[window.BB_CCY]);
    var sym=window.BB_CCY==='twd'?'NT$':'HK$';
    return sym+n.toLocaleString('en-US');
  };
  window.bbCNYFmt=function(cny){
    return '¥'+Math.round(Number(cny)).toLocaleString('en-US');
  };
  document.addEventListener('DOMContentLoaded',function(){
    var nodes=document.querySelectorAll('.bb-c');
    for(var i=0;i<nodes.length;i++){nodes[i].textContent=window.bbMoney(nodes[i].getAttribute('data-cny'));}
    var btns=document.querySelectorAll('.bb-ccy-btn');
    for(var j=0;j<btns.length;j++){btns[j].classList.toggle('active',btns[j].getAttribute('data-c')===window.BB_CCY);}
    var bar=document.getElementById('bbCcyBar');
    if(bar){bar.addEventListener('click',function(e){
      var b=e.target.closest('.bb-ccy-btn');if(!b)return;
      var nc=b.getAttribute('data-c');if(nc===window.BB_CCY)return;
      localStorage.setItem('bb_ccy',nc);location.reload();
    });}
  });
})();
</script>

</head>
<body>
  <div class="page-frame">
    <div class="brand-header">
      <div class="brand-name">BUFFALO BOXING</div>
      <div class="brand-series">Darwin Custom Series</div>
    </div>
<div class="bb-ccy" id="bbCcyBar">
      <button type="button" class="bb-ccy-btn" data-c="twd">台幣 TWD</button>
      <button type="button" class="bb-ccy-btn" data-c="hkd">港幣 HKD</button>
    </div>


    <div class="step-nav" id="stepNav">
      <button type="button" class="step-nav-item current" data-href="g1.size.html"><span class="sn-num">1</span>尺寸</button>
      <button type="button" class="step-nav-item" data-href="g2.leather.html"><span class="sn-num">2</span>皮革</button>
      <button type="button" class="step-nav-item" data-href="g3.color.html"><span class="sn-num">3</span>配色</button>
      <button type="button" class="step-nav-item" data-href="g4.customize.html"><span class="sn-num">4</span>印字</button>
      <button type="button" class="step-nav-item" data-href="g5.result.html"><span class="sn-num">5</span>結果</button>
    </div>

    <div class="page-title">選擇拳套尺寸 / OZ</div>
<button class="copy-prev-btn" id="copyPrevBtn" type="button" style="display:none;">一鍵複製上一副配置，再按需修改</button>
    <div class="size-list" id="sizeList">
      <div class="size-item" data-size="8">8 oz</div>
      <div class="size-item" data-size="10">10 oz</div>
      <div class="size-item" data-size="12">12 oz</div>
      <div class="size-item" data-size="14">14 oz</div>
      <div class="size-item" data-size="16">16 oz</div>
    </div>
    <button class="next-btn" id="nextBtn">NEXT · 選擇皮革</button>
  <div class="global-nav">
      <a class="gn-link" href="../index.html">返回定製工具首頁 · 加選/改數量</a>
      <a class="gn-link gn-bundle" id="gnBundle" href="../bundle.html">返回套裝彙總</a>
    </div>
<div class="bb-brand-footer">
      <div class="bb-slogan">CRAFT IS HUMAN</div>
      <div class="bb-sub">BUFFALO BOXING</div>
    </div>

    </div>

  <script>
    /* ===== 統一存儲封裝（每件獨立前綴） ===== */
    const BBSUIT_KEY = 'bb_suit';
    function BB_suit(){ try{ return JSON.parse(localStorage.getItem(BBSUIT_KEY)) || null; }catch(e){ return null; } }
    function BB_prefix(){
      const s = BB_suit();
      if(!s || !Array.isArray(s.items) || !s.items.length) return '';
      const idx = (typeof s.current === 'number') ? s.current : 0;
      return 'bb_' + idx + '_';
    }
    const LS = {
      get(k){ return localStorage.getItem(BB_prefix() + k); },
      set(k,v){ localStorage.setItem(BB_prefix() + k, v); },
      remove(k){ localStorage.removeItem(BB_prefix() + k); }
    };

    const sizeList = document.getElementById('sizeList');
    const nextBtn = document.getElementById('nextBtn');
    let selectedSize = '';

    // 讀取已選尺寸（如果有）
    const savedSize = LS.get('size');
    if (savedSize) {
      document.querySelector(`.size-item[data-size="${savedSize}"]`).classList.add('active');
      selectedSize = savedSize;
    }

    sizeList.addEventListener('click', (e) => {
      const item = e.target.closest('.size-item');
      if (item) {
        document.querySelectorAll('.size-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        selectedSize = item.dataset.size;
      }
    });

    nextBtn.addEventListener('click', () => {
      if (selectedSize) {
        LS.set('size', selectedSize);
        window.location.href = 'g2.leather.html';
      } else {
        alert('請先選擇尺寸');
      }
    });

    /* ===== 步驟導航：跳轉前保存 ===== */
    window.__bbSave = function(){ if (selectedSize) LS.set('size', selectedSize); };
    document.getElementById('stepNav').addEventListener('click', function(e){
      const it = e.target.closest('.step-nav-item');
      if (!it) return;
      try { if (window.__bbSave) window.__bbSave(); } catch(err){}
      window.location.href = it.dataset.href;
    });
      /* ===== 一鍵複製上一副配置（同款多件） ===== */
    (function initCopyPrev(){
      const suit = BB_suit();
      if (!suit || !Array.isArray(suit.items)) return;
      const cur = (typeof suit.current === 'number') ? suit.current : 0;
      if (cur < 1) return;
      if (!suit.items[cur-1] || suit.items[cur].type !== suit.items[cur-1].type) return;
      const btn = document.getElementById('copyPrevBtn');
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        const prevPfx = 'bb_' + (cur - 1) + '_';
        const curPfx = 'bb_' + cur + '_';
        Object.keys(localStorage).forEach(k => {
          if (k.indexOf(prevPfx) === 0) {
            localStorage.setItem(curPfx + k.slice(prevPfx.length), localStorage.getItem(k));
          }
        });
        location.reload();
      });
    })();
</script>
<script>
    (function(){
      try{
        var st=BB_suit();
        var b=document.getElementById('gnBundle');
        if(b && st && st.mode==='suit') b.style.display='inline-block';
      }catch(e){}
    })();
  </script>
</body>
</html>
